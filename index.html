        .animate-on-scroll {

        }
        .animate-on-scroll.is-visible {

                                    <i data-lucide="mail" class="text-stone-700 group-hover:text-white w-6 h-6 sm:w-7 sm:h-7 transition-colors"></i>
                                </div>
                                <div class="text-left flex-1 min-w-0">
                                    <span class="font-bold text-lg text-stone-900 block">Email</span>
                                    <p class="text-sm text-stone-500 truncate mt-0.5">natorium23cg@gmail.com</p>
                                </div>
                                <div class="w-10 h-10 rounded-full bg-stone-100 group-hover:bg-orange-600 group-hover:text-white flex items-center justify-center transition-colors shrink-0">
                                    <i data-lucide="arrow-up-right" class="w-4 h-4"></i>
                                </div>
                            </a>
                        </div>
                    </div>

                    <!-- 右カラム：ご依頼テンプレート (7 cols) -->
                    <div class="lg:col-span-7 bg-white p-7 sm:p-10 lg:p-12 rounded-3xl border border-stone-200/80 text-left shadow-sm relative overflow-hidden animate-on-scroll delay-300">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-6">
                            <div class="flex items-center gap-3">
                                <span class="bg-orange-600 w-1.5 h-7 rounded-full block"></span>
                                <h4 class="text-stone-900 font-bold text-lg md:text-xl">ご依頼テンプレート</h4>
                            </div>
                            <button 
                                type="button"
                                onclick="copyTemplateText()"
                                class="inline-flex items-center justify-center gap-2 bg-stone-800 hover:bg-stone-700 text-white font-semibold text-xs md:text-sm px-5 py-2.5 rounded-full transition-all shrink-0"
                            >
                                <i data-lucide="copy" class="w-4 h-4"></i>
                                <span>テンプレートをコピー</span>
                            </button>
                        </div>

                        <textarea 
                            id="commission-template-text"
                            rows="8"
                            class="w-full text-sm md:text-base bg-stone-50 focus:bg-white p-5 rounded-2xl border border-stone-200 focus:border-stone-400 focus:outline-none text-stone-700 leading-relaxed transition-colors"
                        >■ ご希望モデルの種類 (Vtuber/VRChatアバター/その他):
■ キャラクター概要 (既存デザインがある場合はURLや画像添付):
■ 使用用途 (配信/VRChat/ゲーム開発など):
■ 納品希望形式 (VRM/UnityPackage/FBXなど):
■ 予算感 (可能な範囲でご記入ください):
■ 納期希望日:
■ その他ご要望:</textarea>

                        <p class="mt-4 text-xs md:text-sm text-stone-500">
                            ※ 上記テンプレートをコピーし、DMまたはメールにてご連絡いただけるとスムーズです。
                        </p>
                    </div>
                </div>
            </section>
        `;

        const Footer = () => `
            <footer class="relative z-10 py-12 bg-stone-900 text-stone-300 text-center">
                <div class="max-w-[1480px] mx-auto px-6 sm:px-10 lg:px-16 flex flex-col md:flex-row items-center justify-between gap-6">
                    <div class="flex items-center gap-3">
                        <img src="${PROFILE_IMAGE_URL}" alt="Natorium_23" class="w-8 h-8 rounded-full object-cover" />
                        <span class="font-bold text-base text-white">Natorium_23</span>
                    </div>

                    <div class="flex items-center gap-4">
                        <a href="https://x.com/Natorium_23" target="_blank" rel="noopener noreferrer" class="text-stone-400 hover:text-white transition-colors">
                            <i data-lucide="twitter" class="w-5 h-5"></i>
                        </a>
                        <a href="mailto:natorium23cg@gmail.com" class="text-stone-400 hover:text-white transition-colors">
                            <i data-lucide="mail" class="w-5 h-5"></i>
                        </a>
                    </div>
                </div>
                <div class="max-w-[1480px] mx-auto px-6 sm:px-10 lg:px-16 mt-8 pt-6 border-t border-stone-800 text-xs text-stone-500">
                    &copy; 2024 Natorium_23. All rights reserved.
                </div>
            </footer>
        `;

        const WorkModal = (work) => {
            if (!work) return '';

            const imageMap = [
                { 
                    src: work.image, 
                    alt: `${work.title} メインビジュアル`, 
                    label: 'メインビジュアル',
                    key: 'main'
                },
            ];

            if (work.imageTpose) {
                imageMap.push({
                    src: work.imageTpose, 
                    alt: `${work.title} Tポーズ`, 
                    label: 'Tポーズ (リギング確認用)',
                    key: 'tpose'
                });
            }

            if (work.gallery && Array.isArray(work.gallery)) {
                work.gallery.forEach((imgUrl, index) => {
                    imageMap.push({
                        src: imgUrl,
                        alt: `${work.title} ギャラリー ${index + 1}`,
                        label: `ギャラリー ${index + 1}`,
                        key: `gallery-${index}`
                    });
                });
            }

            const currentImageKey = activeModalImageKey || 'main';
            const currentImage = imageMap.find(i => i.key === currentImageKey) || imageMap[0];

            const hasMainLink = work.link && work.link !== '#';
            const hasVroidLink = work.vroidHubLink && work.vroidHubLink !== '#' && work.vroidHubLink !== null;

            let linksHtml = '';
            if (hasMainLink || hasVroidLink) {
                linksHtml += '<div class="pt-6 border-t border-slate-100 flex flex-col gap-3">';
                
                if (hasMainLink) {
                    linksHtml += `
                        <a 
                            href="${work.link}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="w-full inline-flex items-center justify-center gap-2 text-white bg-slate-900 hover:bg-orange-500 px-6 py-4 rounded-2xl font-bold transition-all duration-300 shadow-lg hover:shadow-xl group"
                        >
                            <span>関連リンク・動画を見る (X)</span>
                            <i data-lucide="external-link" class="w-5 h-5 group-hover:translate-x-1 transition-transform"></i>
                        </a>
                    `;
                }

                if (hasVroidLink) {
                    linksHtml += `
                        <a 
                            href="${work.vroidHubLink}" 
                            target="_blank" 
                            rel="noopener noreferrer"
                            class="w-full inline-flex items-center justify-center gap-2 text-rose-500 bg-rose-50/60 border-2 border-rose-500 hover:bg-rose-500 hover:text-white px-6 py-4 rounded-2xl font-bold transition-all duration-300 shadow-sm hover:shadow-md group"
                        >
                            <span class="flex items-center gap-2">
                                <i data-lucide="box" class="w-5 h-5 group-hover:scale-110 transition-transform"></i>
                                <span>VRoid Hubで3Dモデルを見る</span>
                            </span>
                        </a>
                    `;
                }

                linksHtml += '</div>';
            }

            return `
                <div 
                    id="work-modal"
                    class="fixed inset-0 z-[100] bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-3 sm:p-6 overflow-y-auto"
                    onclick="closeModal()" 
                >
                    <div 
                        class="bg-white rounded-[2.5rem] w-full max-w-6xl max-h-[92vh] overflow-hidden shadow-2xl flex flex-col lg:flex-row border border-white/20"
                        onclick="event.stopPropagation()"
                    >
                        <!-- 左側: 3Dスタジオビューワー風画像エリア (2/3) -->
                        <div class="w-full lg:w-2/3 shrink-0 bg-slate-900 relative flex flex-col justify-between p-4 sm:p-6 h-[52vh] lg:h-[86vh] overflow-hidden studio-grid-bg">
                            
                            <!-- トップバー -->
                            <div class="flex items-center justify-between z-20">
                                <div class="flex items-center gap-2 bg-slate-800/90 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-slate-700 text-xs font-mono text-slate-300">
                                    <span class="w-2 h-2 rounded-full bg-orange-500"></span>
                                    <span>${currentImage.label}</span>
                                </div>

                                ${imageMap.length > 1 ? `
                                    <div class="flex items-center gap-1 bg-slate-800/90 p-1 rounded-full border border-slate-700">
                                        ${imageMap.map(img => `
                                            <button 
                                                onclick="setActiveModalImage('${img.key}')"
                                                class="px-3 py-1 rounded-full text-xs font-bold transition-all ${
                                                    img.key === currentImageKey 
                                                        ? 'bg-orange-500 text-white' 
                                                        : 'text-slate-300 hover:text-white'
                                                }"
                                            >
                                                ${img.key === 'main' ? 'メイン' : img.key === 'tpose' ? 'Tポーズ' : img.label}
                                            </button>
                                        `).join('')}
                                    </div>
                                ` : ''}

                                <button 
                                    onclick="closeModal()"
                                    class="bg-slate-800 hover:bg-orange-500 p-2 rounded-full text-white transition-colors lg:hidden"
                                >
                                    <i data-lucide="x" class="w-5 h-5"></i>
                                </button>
                            </div>
                            
                            <!-- メイン画像 -->
                            <div class="w-full flex-1 flex items-center justify-center my-2 relative min-h-0">
                                <img 
                                    src="${currentImage.src}" 
                                    alt="${currentImage.alt}" 
                                    class="max-w-full max-h-full object-contain transition-all duration-300 drop-shadow-2xl rounded-xl"
                                    onerror="this.onerror=null; this.src='https://placehold.co/1000x1500/EF4444/ffffff?text=Image+Error';"
                                />
                            </div>

                            <!-- サムネイルセレクター -->
                            <div class="flex-shrink-0 w-full flex space-x-3 justify-center items-center h-20 z-10 overflow-x-auto">
                                ${imageMap.map(data => `
                                    <button
                                        onclick="setActiveModalImage('${data.key}')" 
                                        class="group relative w-16 h-16 sm:w-20 sm:h-20 bg-slate-800 rounded-2xl overflow-hidden cursor-pointer transition-all duration-200 border-2 flex-shrink-0 ${
                                            data.key === currentImageKey ? 'border-orange-500 scale-105 shadow-lg shadow-orange-500/30' : 'border-slate-700 opacity-60 hover:opacity-100'
                                        }"
                                    >
                                        <img 
                                            src="${data.src}" 
                                            alt="${data.alt}" 
                                            class="w-full h-full object-cover"
                                        />
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 右側: 詳細スペック＆説明 (1/3) -->
                        <div class="w-full lg:w-1/3 flex flex-col bg-white h-full max-h-[40vh] lg:max-h-[86vh] relative">
                            <button 
                                onclick="closeModal()"
                                class="absolute top-5 right-5 w-10 h-10 rounded-full bg-slate-100 hover:bg-slate-900 text-slate-600 hover:text-white items-center justify-center transition-colors z-20 hidden lg:flex"
                            >
                                <i data-lucide="x" class="w-5 h-5"></i>
                            </button>

                            <div class="p-7 lg:p-9 overflow-y-auto custom-scroll flex-1">
                                <div class="mb-6">
                                    <span class="px-3.5 py-1 text-xs font-bold tracking-wider text-orange-600 bg-orange-100 rounded-full uppercase inline-block mb-3">
                                        ${filterTabs.find(t => t.id === work.category)?.name || work.category}
                                    </span>
                                    <h2 class="text-xl lg:text-2xl font-bold text-slate-900 leading-tight">
                                        ${work.title.replace(/ "(.+)"/, '<br/><span class="block mt-1.5 text-2xl lg:text-3xl font-black text-slate-900">"$1"</span>')}
                                    </h2>
                                </div>

                                <!-- 制作コメント -->
                                <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200/70 mb-7">
                                    <div class="text-[11px] font-mono font-bold text-slate-400 uppercase tracking-wider mb-1.5">CREATOR'S COMMENT</div>
                                    <p class="text-slate-700 leading-relaxed font-medium text-sm md:text-base">
                                        ${work.description}
                                    </p>
                                </div>

                                <!-- 使用ツール・仕様 -->
                                <div class="mb-8">
                                    <h3 class="text-xs font-mono font-bold text-slate-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                                        <i data-lucide="cpu" class="w-4 h-4 text-orange-500"></i> Specs & Tools
                                    </h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${work.specs.filter(Boolean).map(spec => `
                                            <span class="inline-flex items-center px-3.5 py-1.5 rounded-xl text-xs font-bold bg-white text-slate-800 border border-slate-200 shadow-sm">
                                                ${spec}
                                            </span>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- 外部リンクボタン群 -->
                                ${linksHtml}

                                <!-- この作品のような依頼をする導線 -->
                                <div class="mt-6 pt-6 border-t border-slate-100">
                                    <button 
                                        onclick="closeModal(); scrollToSection('contact');"
                                        class="w-full py-3.5 px-4 rounded-2xl bg-orange-50 hover:bg-orange-100 text-orange-600 font-bold text-xs flex items-center justify-center gap-2 transition-colors"
                                    >
                                        <i data-lucide="message-circle" class="w-4 h-4"></i>
                                        <span>この実績のようなモデル制作を相談する</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        // ====================================================================
        // Animations & Interactive Initializers
        // ====================================================================
        const initScrollAnimations = () => {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        obs.unobserve(entry.target);
                    }
                });
            }, {
                root: null,
                rootMargin: '0px 0px -40px 0px',
                threshold: 0.08
            });

            document.querySelectorAll('.animate-on-scroll:not(.is-visible)').forEach(el => {
                observer.observe(el);
            });
        };

        // キーボードESCでモーダルを閉じる
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && selectedWork) {
                closeModal();
            }
        });

        // ====================================================================
        // Main App Render
        // ====================================================================
        const renderApp = () => {
            const app = document.getElementById('root');
            if (!app) return;

            app.innerHTML = `
                <div class="min-h-screen relative studio-grid-bg">
                    <!-- 控えめで落ち着いた背景グラデーション装飾 -->
                    <div class="fixed top-[-15%] right-[-10%] w-[500px] h-[500px] bg-orange-100/40 rounded-full blur-[120px] pointer-events-none z-0"></div>
                    <div class="fixed bottom-[-15%] left-[-10%] w-[500px] h-[500px] bg-stone-200/50 rounded-full blur-[120px] pointer-events-none z-0"></div>

                    ${Header()}
                    ${Hero()}
                    ${About()}
                    ${Works()}
                    ${Price()}
                    ${Flow()}
                    ${Contact()}
                    ${Footer()}
                </div>
            `;
            
            renderModal();

            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            initScrollAnimations();
        };

        // ====================================================================
        // Loading Screen Sequence
        // ====================================================================
        const startLoadingAnimation = () => {
            document.body.style.overflow = 'hidden'; 
            window.scrollTo(0, 0); 

            const loadingScreen = document.getElementById('loading-screen');
            const numberElement = document.getElementById('loading-number');
            const barElement = document.getElementById('loading-bar');
            
            let currentNumber = 0;
            
            const counter = setInterval(() => {
                let increment = (Math.random() * 4 + 1.2) * 0.65; 
                if (currentNumber > 80) increment = (Math.random() * 1.8 + 0.5) * 0.65; 
                
                currentNumber += increment;

                if (currentNumber >= 100) {
                    currentNumber = 100;
                    clearInterval(counter);
                    
                    numberElement.textContent = 100;
                    barElement.style.width = '100%';

                    setTimeout(() => {
                        loadingScreen.classList.add('opacity-0', '-translate-y-full');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                            document.body.style.overflow = ''; 
                        }, 700); 
                    }, 300);
                } else {
                    numberElement.textContent = Math.floor(currentNumber);
                    barElement.style.width = `${currentNumber}%`;
                }
            }, 25);
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            startLoadingAnimation();
        });
    </script>
</body>
</html>
