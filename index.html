        .md-interactive::after {

                                </button>
                            </div>
                            
                            <!-- メイン画像（暗い影や暗転フィルターなしで本来の色味を100%表示） -->
                            <div class="w-full flex-1 flex items-center justify-center my-2 relative min-h-0">
                                <img 
                                    src="${currentImage.src}" 
                                    alt="${currentImage.alt}" 
                                    class="max-w-full max-h-full object-contain transition-all duration-300 rounded-md-md"
                                    onerror="this.onerror=null; this.src='https://placehold.co/1000x1500/EF4444/ffffff?text=Image+Error';"
                                />
                            </div>

                            <!-- サムネイルセレクター（暗みをなくしクリアに表示） -->
                            <div class="flex-shrink-0 w-full flex space-x-3 justify-center items-center h-20 z-10 overflow-x-auto">
                                ${imageMap.map(data => `
                                    <button
                                        onclick="setActiveModalImage('${data.key}')" 
                                        class="relative w-16 h-16 sm:w-20 sm:h-20 bg-white rounded-md-md overflow-hidden cursor-pointer transition-all duration-200 border-2 flex-shrink-0 ${
                                            data.key === currentImageKey ? 'border-[var(--md-sys-color-primary)] scale-105 md-elevation-2' : 'md-border-outline-variant hover:border-stone-400'
                                        }"
                                    >
                                        <img 
                                            src="${data.src}" 
                                            alt="${data.alt}" 
                                            class="w-full h-full object-cover"
                                        />
                                    </button>
                                `).join('')}
                            </div>
                        </div>

                        <!-- 右側: 詳細スペック＆説明 (1/3) -->
                        <div class="w-full lg:w-1/3 flex flex-col md-bg-surface h-full max-h-[40vh] lg:max-h-[86vh] relative">
                            <button 
                                onclick="closeModal()"
                                class="md-interactive absolute top-5 right-5 w-10 h-10 rounded-full md-bg-surface-container-high md-text-on-surface items-center justify-center z-20 hidden lg:flex"
                                aria-label="閉じる"
                            >
                                <span class="material-symbols-outlined">close</span>
                            </button>

                            <div class="p-7 lg:p-9 overflow-y-auto custom-scroll flex-1">
                                <div class="mb-6 pr-8">
                                    <span class="px-3 py-1 text-xs font-bold tracking-wider md-bg-primary-container rounded-md-sm uppercase inline-block mb-3">
                                        ${filterTabs.find(t => t.id === work.category)?.name || work.category}
                                    </span>
                                    <h2 class="text-xl lg:text-2xl font-bold md-text-on-surface leading-tight">
                                        ${work.title.replace(/ "(.+)"/, '<br/><span class="block mt-1.5 text-2xl lg:text-3xl font-extrabold md-text-primary">"$1"</span>')}
                                    </h2>
                                </div>

                                <!-- 制作コメント (M3 Surface Container Card) -->
                                <div class="md-bg-surface-container p-5 rounded-md-lg border md-border-outline-variant mb-7">
                                    <div class="text-[11px] font-mono font-bold md-text-primary uppercase tracking-wider mb-1.5 flex items-center gap-1.5">
                                        <span class="material-symbols-outlined text-[16px]">notes</span>
                                        <span>CREATOR'S COMMENT</span>
                                    </div>
                                    <p class="md-text-on-surface leading-relaxed font-normal text-sm md:text-base">
                                        ${work.description}
                                    </p>
                                </div>

                                <!-- 使用ツール・仕様 (M3 Chips) -->
                                <div class="mb-8">
                                    <h3 class="text-xs font-mono font-bold md-text-on-surface-variant uppercase tracking-widest mb-3 flex items-center gap-1.5">
                                        <span class="material-symbols-outlined text-[18px] md-text-primary">memory</span>
                                        <span>Specs & Tools</span>
                                    </h3>
                                    <div class="flex flex-wrap gap-2">
                                        ${work.specs.filter(Boolean).map(spec => `
                                            <span class="inline-flex items-center px-3.5 py-1.5 rounded-md-sm text-xs font-bold md-bg-surface-lowest md-text-on-surface border md-border-outline-variant md-elevation-1">
                                                ${spec}
                                            </span>
                                        `).join('')}
                                    </div>
                                </div>

                                <!-- 外部リンクボタン群 -->
                                ${linksHtml}

                                <!-- この作品のような依頼をする導線 (M3 Outlined Button) -->
                                <div class="mt-6 pt-6 border-t md-border-outline-variant">
                                    <button 
                                        onclick="closeModal(); scrollToSection('contact');"
                                        class="md-interactive w-full h-11 px-4 rounded-full md-bg-surface-container-high md-text-primary font-bold text-xs flex items-center justify-center gap-2 border md-border-outline-variant"
                                    >
                                        <span class="material-symbols-outlined text-[18px]">forum</span>
                                        <span>この実績のようなモデル制作を相談する</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        };

        // ====================================================================
        // Animations & Interactive Initializers
        // ====================================================================
        const initScrollAnimations = () => {
            const observer = new IntersectionObserver((entries, obs) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('is-visible');
                        obs.unobserve(entry.target);
                    }
                });
            }, {
                root: null,
                rootMargin: '0px 0px -40px 0px',
                threshold: 0.08
            });

            document.querySelectorAll('.animate-on-scroll:not(.is-visible)').forEach(el => {
                observer.observe(el);
            });
        };

        // キーボードESCでモーダルを閉じる
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && selectedWork) {
                closeModal();
            }
        });

        // ====================================================================
        // Main App Render
        // ====================================================================
        const renderApp = () => {
            const app = document.getElementById('root');
            if (!app) return;

            app.innerHTML = `
                <div class="min-h-screen relative">
                    ${Header()}
                    <main>
                        ${Hero()}
                        ${About()}
                        ${Works()}
                        ${Price()}
                        ${Flow()}
                        ${Contact()}
                    </main>
                    ${Footer()}
                    ${FloatingActionButton()}
                    ${MobileBottomNavigation()}
                </div>
            `;
            
            renderModal();
            initScrollAnimations();
        };

        // ====================================================================
        // Loading Screen Sequence
        // ====================================================================
        const startLoadingAnimation = () => {
            document.body.style.overflow = 'hidden'; 
            window.scrollTo(0, 0); 

            const loadingScreen = document.getElementById('loading-screen');
            const numberElement = document.getElementById('loading-number');
            const barElement = document.getElementById('loading-bar');
            
            let currentNumber = 0;
            
            const counter = setInterval(() => {
                let increment = (Math.random() * 4 + 1.5) * 0.75; 
                if (currentNumber > 80) increment = (Math.random() * 2 + 0.6) * 0.75; 
                
                currentNumber += increment;

                if (currentNumber >= 100) {
                    currentNumber = 100;
                    clearInterval(counter);
                    
                    numberElement.textContent = 100;
                    barElement.style.width = '100%';

                    setTimeout(() => {
                        loadingScreen.classList.add('opacity-0', '-translate-y-full');
                        setTimeout(() => {
                            loadingScreen.style.display = 'none';
                            document.body.style.overflow = ''; 
                        }, 700); 
                    }, 250);
                } else {
                    numberElement.textContent = Math.floor(currentNumber);
                    barElement.style.width = `${currentNumber}%`;
                }
            }, 22);
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderApp();
            startLoadingAnimation();
        });
    </script>
</body>
</html>
